services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://checkout:checkout@db:5432/checkout?sslmode=disable
      COUPON_EVERY_N_ORDERS: "5"
      COUPON_DISCOUNT_PERCENT: "10"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
